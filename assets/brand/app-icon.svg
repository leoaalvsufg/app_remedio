<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FBFF"/>
      <stop offset="1" stop-color="#CFE7FF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#005BBF" flood-opacity="0.22"/>
    </filter>
    <clipPath id="capsule">
      <rect x="202" y="362" width="620" height="300" rx="150"/>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#background)"/>
  <circle cx="512" cy="512" r="360" fill="#FFFFFF" fill-opacity="0.58"/>
  <g transform="rotate(-18 512 512)" filter="url(#shadow)">
    <g clip-path="url(#capsule)">
      <rect x="202" y="362" width="310" height="300" fill="#007AFF"/>
      <rect x="512" y="362" width="310" height="300" fill="#FFFFFF"/>
    </g>
    <rect x="202" y="362" width="620" height="300" rx="150" fill="none" stroke="#005BBF" stroke-width="20"/>
    <line x1="512" y1="373" x2="512" y2="651" stroke="#005BBF" stroke-width="16"/>
  </g>
</svg>
